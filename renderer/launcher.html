<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>OneShot</title>
  <style>
    :root { --fg: #1d1d1f; --hover: rgba(0,0,0,.07); --press: rgba(0,0,0,.12); --line: rgba(0,0,0,.1); }
    @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --hover: rgba(255,255,255,.1); --press: rgba(255,255,255,.16); --line: rgba(255,255,255,.12); } }
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none; color: var(--fg); }
    .bar { height: 100%; display: flex; align-items: center; justify-content: center; gap: 2px; padding: 0 6px; -webkit-app-region: drag; }
    button { -webkit-app-region: no-drag; width: 34px; height: 32px; border: 0; border-radius: 9px; background: transparent; color: inherit;
      display: grid; place-items: center; opacity: .85; transition: background .12s, opacity .12s; }
    button:hover { background: var(--hover); opacity: 1; }
    button:active { background: var(--press); }
    .sep { width: 1px; height: 18px; background: var(--line); margin: 0 5px; }
    svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
    #close svg { width: 14px; height: 14px; }
    body.drop .bar { box-shadow: inset 0 0 0 2px #0a84ff; border-radius: 10px; }
  </style>
</head>
<body>
  <div class="bar">
    <button data-capture="area" title="Capture Area  ⌥⇧4"><svg viewBox="0 0 24 24"><path d="M4 8V5.5A1.5 1.5 0 015.5 4H8M16 4h2.5A1.5 1.5 0 0120 5.5V8M20 16v2.5a1.5 1.5 0 01-1.5 1.5H16M8 20H5.5A1.5 1.5 0 014 18.5V16"/><path d="M12 9v6M9 12h6"/></svg></button>
    <button data-capture="window" title="Capture Window  ⌥⇧5"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M3.5 9h17"/></svg></button>
    <button data-capture="screen" title="Capture Screen  ⌥⇧3"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M9 20h6M12 16.5V20"/></svg></button>
    <span class="sep"></span>
    <button id="open" title="Open Image…  ⌘O"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M20.5 16l-5-5-8.5 8.5"/></svg></button>
    <button id="folder" title="Captures Folder"><svg viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 012-2h3.5l2 2h7.5a2 2 0 012 2v7.5a2 2 0 01-2 2h-13a2 2 0 01-2-2z"/></svg></button>
    <span class="sep"></span>
    <button id="close" title="Close  esc"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
  </div>
  <script type="module" src="launcher.js"></script>
</body>
</html>
